name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nama aplikasi'
        required: true
        type: string
      zip_url:
        description: 'URL download ZIP project (Telegram file URL)'
        required: false
        default: ''
        type: string
      url:
        description: 'URL web (opsional, untuk webview)'
        required: false
        default: ''
        type: string
      package_name:
        description: 'Package name Android'
        required: false
        default: 'com.elxz.app'
        type: string
      user_id:
        description: 'Telegram user id'
        required: false
        default: ''
        type: string
      build_mode:
        description: 'release atau debug'
        required: false
        default: 'release'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Download project ZIP
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
        run: |
          set -e
          mkdir -p work
          if [ -z "$ZIP_URL" ]; then
            echo "ERROR: zip_url kosong. Bot harus mengirim URL file ZIP."
            exit 1
          fi
          echo "Downloading ZIP..."
          # Retry download (Telegram URL kadang lambat)
          for i in 1 2 3 4 5; do
            if curl -L --fail --retry 3 --retry-delay 5 \
              -A "Mozilla/5.0" \
              -o project.zip \
              "$ZIP_URL"; then
              echo "Download OK"
              break
            fi
            echo "Retry $i..."
            sleep 3
            if [ "$i" = "5" ]; then
              echo "ERROR: Gagal download ZIP dari Telegram URL"
              exit 1
            fi
          done
          unzip -o project.zip -d work
          # Auto-detect folder yang ada pubspec.yaml
          FOUND=$(find work -name "pubspec.yaml" -type f 2>/dev/null | head -n 1)
          if [ -z "$FOUND" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan. ZIP harus berisi project Flutter."
            find work -maxdepth 3 -type f | head -50
            exit 1
          fi
          PROJ_DIR=$(dirname "$FOUND")
          echo "PROJECT_DIR=$PROJ_DIR" >> $GITHUB_ENV
          echo "Flutter project: $PROJ_DIR"
          cat "$FOUND" | head -20

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter clean || true
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          MODE="${{ github.event.inputs.build_mode }}"
          MODE=$(echo "$MODE" | tr '[:upper:]' '[:lower:]')
          echo "Build mode: $MODE"
          if [ "$MODE" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Locate & prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(find build -name "*.apk" -type f 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan"
            find build -type f 2>/dev/null | head -30 || true
            exit 1
          fi
          echo "APK: $APK"
          ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/app-release.apk"
          ls -lh "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app-release.apk
          retention-days: 2
          if-no-files-found: error
